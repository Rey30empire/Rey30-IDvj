[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rey30-idvj-adk"
version = "0.1.0"
description = "Python client for the Rey30 IDvj agent runtime: sessions, streamed turns, and host tools over `rey30-idvj cli agent rpc`"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Reinier Tamayo" }]
keywords = ["rey30-idvj", "agent", "adk", "json-rpc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
]
# No dependencies on purpose: the runtime is a process, the channel is JSON, and
# a host that has to install a tree to embed an agent will not.
dependencies = []

[tool.setuptools]
packages = ["rey30_idvj_adk"]

[tool.setuptools.package-data]
rey30_idvj_adk = ["py.typed"]
