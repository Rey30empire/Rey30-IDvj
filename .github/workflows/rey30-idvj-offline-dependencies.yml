name: Rey30 IDvj offline dependency artifacts

# Builds offline dependency tarballs for reproducible/offline Flatpak builds:
#   - cargo-vendor: vendored Rust crates + .cargo/config.toml, covering both
#     the app lockfile and the standalone llamacpp plugin lockfile (the
#     engine worker is built from the plugin crate on its own)
#   - yarn-cache: populated Yarn caches for both yarn projects (repo root and
#     src-tauri/plugins), enabling offline `yarn install` in the Flatpak sandbox
# The files remain workflow artifacts; this job does not publish a release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source tag to prepare dependencies from (e.g. v0.8.4)'
        required: true
      ref:
        description: 'Git ref to build the tarballs from (defaults to the tag)'
        required: false
        default: ''

jobs:
  dependency-tarballs:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Vendor Rust crates
        working-directory: src-tauri
        run: |
          # Appended, not overwritten: the committed config carries settings the
          # build still needs. The plugin lives under src-tauri, so cargo finds
          # this config (and the source replacement) when building it too.
          mkdir -p .cargo
          cargo vendor --locked \
            --sync plugins/tauri-plugin-llamacpp/Cargo.toml \
            vendor >> .cargo/config.toml
          cat .cargo/config.toml

      - name: Pack cargo-vendor tarball
        run: |
          tar -czf "rey30-idvj-cargo-vendor-${TAG}.tar.gz" \
            -C src-tauri \
            .cargo/config.toml \
            vendor
          ls -lh "rey30-idvj-cargo-vendor-${TAG}.tar.gz"

      # Populate each yarn project's local cache. ENABLE_GLOBAL_CACHE=false
      # forces the package zips into <project>/.yarn/cache so they can be
      # tarred and later consumed by an offline `yarn install` in Flatpak.
      # The repo has two independent yarn projects with separate lockfiles.
      - name: Populate yarn caches (offline install source)
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'
        run: |
          yarn install
          ( cd src-tauri/plugins && yarn install )

      - name: Pack yarn-cache tarball
        run: |
          tar -czf "rey30-idvj-yarn-cache-${TAG}.tar.gz" \
            .yarn/cache \
            src-tauri/plugins/.yarn/cache
          ls -lh "rey30-idvj-yarn-cache-${TAG}.tar.gz"

      - name: Generate checksums
        run: sha256sum rey30-idvj-cargo-vendor-*.tar.gz rey30-idvj-yarn-cache-*.tar.gz > rey30-idvj-dependency-tarballs-${TAG}.sha256

      - name: Keep prepared dependency artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rey30-idvj-offline-dependencies
          path: |
            rey30-idvj-cargo-vendor-*.tar.gz
            rey30-idvj-yarn-cache-*.tar.gz
            rey30-idvj-dependency-tarballs-*.sha256
